# AQG UAT — https://aqg-uat.152.42.177.130.sslip.io
#
# ค่าต่างๆ อ่านจาก .env บนเซิร์ฟเวอร์ ซึ่ง tools/deploy-uat.ps1 ตรวจหาให้อัตโนมัติ
# (ดูจาก container ของ reverse proxy และจากบริการที่ใช้งานได้อยู่แล้ว เช่น luckydraw)
#
#   PROXY_NETWORK      ชื่อ docker network ของ Traefik      (เช่น web, proxy, traefik_default)
#   CERT_RESOLVER      ชื่อ certificatesresolver ของ Traefik (เช่น letsencrypt, myresolver)
#   EP_HTTPS / EP_HTTP ชื่อ entrypoint 443 / 80              (เช่น websecure / web)
#   AQG_DOMAIN         โดเมนที่จะเปิดให้เข้า
#
# ถ้าเซิร์ฟเวอร์ยังไม่มี reverse proxy ให้ใช้ docker-compose.caddy.yml แทน

services:
  aqg:
    build: .
    image: aqg:uat
    container_name: aqg-uat
    restart: unless-stopped
    environment:
      PORT: "5190"
      # UAT: ให้ลูกค้ากดเล่นได้เลย ไม่ต้องมีรหัส
      AQG_REQUIRE_CODE: "${AQG_REQUIRE_CODE:-0}"
      AQG_ADMIN_KEY: "${AQG_ADMIN_KEY:?ต้องตั้ง AQG_ADMIN_KEY ใน .env ก่อน}"
    volumes:
      # วีดีโอ 261 MB — ไม่ใส่ใน image เพื่อให้ build เร็วและ redeploy ไม่ต้องอัปใหม่
      - ./video:/app/video:ro
      # ผลการประเมิน + ความคิดเห็น ต้องอยู่รอดตอน redeploy
      - aqg-results:/app/results
      - aqg-config:/app/config
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${PROXY_NETWORK:-web}"
      traefik.http.routers.aqg-uat.rule: "Host(`${AQG_DOMAIN:-aqg-uat.152.42.177.130.sslip.io}`)"
      traefik.http.routers.aqg-uat.entrypoints: "${EP_HTTPS:-websecure}"
      traefik.http.routers.aqg-uat.tls: "true"
      traefik.http.routers.aqg-uat.tls.certresolver: "${CERT_RESOLVER:-letsencrypt}"
      traefik.http.services.aqg-uat.loadbalancer.server.port: "5190"
      # http -> https
      traefik.http.routers.aqg-uat-http.rule: "Host(`${AQG_DOMAIN:-aqg-uat.152.42.177.130.sslip.io}`)"
      traefik.http.routers.aqg-uat-http.entrypoints: "${EP_HTTP:-web}"
      traefik.http.routers.aqg-uat-http.middlewares: "aqg-https@docker"
      traefik.http.middlewares.aqg-https.redirectscheme.scheme: "https"

volumes:
  aqg-results:
  aqg-config:

networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:-web}"
